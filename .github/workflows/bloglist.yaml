name: bloglist tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET: ci-test-secret
      MONGODB_URI: mongodb://127.0.0.1:27017/blogApp
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/bloglist-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bloglist/package-lock.json
            bloglist/frontend/package-lock.json
            bloglist-tests/package-lock.json

      - name: Install backend dependencies
        working-directory: bloglist
        run: npm ci

      - name: Install frontend dependencies
        working-directory: bloglist/frontend
        run: npm ci

      - name: Install Playwright test dependencies
        working-directory: bloglist-tests
        run: npm ci

      - name: Install Chromium
        working-directory: bloglist-tests
        run: npx playwright install --with-deps chromium

      - name: Test backend
        working-directory: bloglist
        run: npm test

      - name: Test frontend
        working-directory: bloglist/frontend
        run: npm test

      - name: Lint frontend
        working-directory: bloglist/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: bloglist
        run: npm run build

      - name: Run Playwright tests
        working-directory: bloglist-tests
        run: npm test -- --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: bloglist-tests/playwright-report/
          retention-days: 14
